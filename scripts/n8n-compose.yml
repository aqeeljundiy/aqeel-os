# n8n workflow automation, connected to aqeelOS (MCP at https://n8n.elkiya.com). Data lives in the n8n-data-v2 volume (owned by aqeelOS since 19 Oct 2026; the earlier n8n-data volume is kept, unused).
services:
  n8n:
    image: n8nio/n8n:2.42.2
    restart: unless-stopped
    env_file: .env
    environment:
      - N8N_HOST=n8n.elkiya.com
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://n8n.elkiya.com/
      - N8N_EDITOR_BASE_URL=https://n8n.elkiya.com/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=true
    volumes:
      - n8n-data-v2:/home/node/.n8n
    networks:
      - dokploy-network
    mem_limit: 1536m
  # n8n.elkiya.com/aqeelos-login goes to aqeelOS, which opens n8n for an agent without signing in
  aqeelos-login:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    command: caddy reverse-proxy --from :80 --to claude-box-ibjaqq-ai-box-1:4400
    networks:
      - dokploy-network
    mem_limit: 64m
volumes:
  n8n-data:
  n8n-data-v2:
networks:
  dokploy-network:
    external: true
