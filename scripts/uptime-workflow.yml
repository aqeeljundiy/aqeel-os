# Waiting for GitHub permission: copy this to .github/workflows/uptime.yml once the GitHub sign-in may change workflows (gh auth refresh -s workflow).
# Is aqeelOS up? Checked from outside the server every 30 minutes (a server that is off cannot report itself).
# Set the repository variable AQEELOS_URL (Settings › Secrets and variables › Actions › Variables) to this install's address.
# If it does not answer three times in a row, this run fails and GitHub emails the repo owner.
# Every 30 minutes keeps it inside GitHub's free minutes for private repositories.
name: aqeelOS uptime
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      URL: ${{ vars.AQEELOS_URL }}
    steps:
      - name: aqeelOS answers
        run: |
          [ -n "$URL" ] || { echo "::error::Set the repository variable AQEELOS_URL"; exit 1; }
          for i in 1 2 3; do
            if curl -fsS --max-time 20 "$URL/healthz" >/dev/null; then echo "aqeelOS is up"; exit 0; fi
            echo "no answer (try $i)"; sleep 20
          done
          echo "::error::aqeelOS ($URL) is not answering. Check your server host's panel: if the server says Stopped, start it."
          exit 1
