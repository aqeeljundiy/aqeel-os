<!doctype html><meta charset="utf-8">
<style>
 body{font:14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;margin:0;padding:16px;width:290px;color:#111}
 h1{font-size:15px;margin:0 0 4px}p{margin:0 0 12px;color:#555;font-size:13px}
 .st{display:flex;align-items:center;gap:8px;font-weight:600;margin:0 0 12px}.dot{width:9px;height:9px;border-radius:50%;background:#bbb}.on .dot{background:#2f7d32}
 label{display:block;font-size:12px;font-weight:600;color:#444;margin:8px 0 4px}
 input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #ddd;border-radius:10px;font:inherit}
 button{width:100%;margin-top:12px;padding:9px;border:0;border-radius:999px;background:#2563eb;color:#fff;font:inherit;font-weight:600;cursor:pointer}
 button.ghost{background:#f1f2f5;color:#222}.err{color:#b42318;font-size:12.5px;min-height:16px;margin-top:8px}
</style>
<h1>aqeelOS: use my browser</h1>
<p>When you choose “My browser” in an aqeelOS chat, the agent works in this browser: next to aqeelOS in the side panel, or in its own window. You can watch and click in any time.</p>
<div class="st" id="st"><span class="dot"></span><span id="stt">Checking…</span></div>
<label for="base">Your aqeelOS address</label><input id="base" placeholder="https://ai.elkiya.com">
<button id="panel">Open aqeelOS beside this page</button><button id="go" class="ghost">Connect</button><button class="ghost" id="off">Disconnect</button><div class="err" id="err"></div>
<script src="popup.js"></script>
