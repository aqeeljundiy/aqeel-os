<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:200 800;font-display:swap;src:url('plus-jakarta-sans.woff2') format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:200 800;font-display:swap;src:url('google-sans-flex-digits.woff2') format('woff2');unicode-range:U+30-39}
@keyframes pin{from{opacity:0;transform:translateY(4px)}}
 body{animation:pin .25s ease;font:14px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:16px;width:300px;color:#111;background:#fff}
 .top{display:flex;align-items:center;gap:10px;margin:0 0 10px}.top img{width:32px;height:32px}
 h1{font-size:15px;margin:0;font-weight:700}.top small{display:block;color:#888;font-size:11.5px;font-weight:500}
 p{margin:0 0 12px;color:#555;font-size:13px}
 .st{display:flex;align-items:center;gap:8px;font-weight:600;margin:0 0 4px}.dot{width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
 .on .dot{background:#2f7d32}.work .dot{background:#2563eb;animation:pulse 1.6s ease-in-out infinite}.need .dot{background:#d97706}.fail .dot{background:#dc2626}
 @keyframes pulse{50%{opacity:.35}}
 .doing{font-variant-numeric:tabular-nums;color:#555;font-size:12.5px;margin:0 0 12px;min-height:0}
 .upd{display:none;background:#eff4ff;color:#1e3a8a;border-radius:12px;padding:9px 12px;font-size:12.5px;margin:0 0 12px}.upd a{color:#1d4ed8;font-weight:600}
 label{display:block;font-size:12px;font-weight:600;color:#444;margin:8px 0 4px}
 input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #ddd;border-radius:10px;font:inherit}
 button{width:100%;margin-top:10px;padding:9px;border:0;border-radius:999px;background:#111;color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:background .15s}
 button:hover{background:#333}
button:disabled{opacity:.6;cursor:default}button.ghost{background:#f1f2f5;color:#222}button.ghost:hover{background:#e6e8ec}
 .err{color:#b42318;font-size:12.5px;min-height:16px;margin-top:8px}.k{color:#888;font-size:11.5px;text-align:center;margin-top:10px}
 details{margin-top:6px}summary{font-size:12px;color:#666;cursor:pointer}
</style>
<div class="top"><img src="icon-48.png" alt=""><div><h1>aqeelOS</h1><small id="ver"></small></div></div>
<div class="st" id="st"><span class="dot"></span><span id="stt">Checking…</span></div>
<div class="doing" id="doing"></div>
<div class="upd" id="upd"></div>
<button id="panel">Open the side chat</button>
<button id="go" class="ghost">Connect</button><button class="ghost" id="off">Disconnect</button>
<details><summary>Your aqeelOS address</summary><input id="base" placeholder="Your aqeelOS address" aria-label="Your aqeelOS address"></details>
<div class="err" id="err"></div>
<p class="k">Alt+A opens the side chat. When a chat uses “My browser”, the agent works in its own tab group here. You see every step, and can stop it or take over any time.</p>
<script src="popup.js"></script>
