# The merge gate a pull request cannot weaken (security audit CR-9, 12 Nov 2026; docs/cloud-fixer.md).
# `pull_request_target` runs THIS file as it is on main, with main's scripts/pr-gate.mjs and .github/fixer-gate.json: a pull
# request that edits any of them changes nothing about how it is judged. Two jobs, both required checks on main:
#   fixer-gate        reads the pull request through the API only (never its code): a small fix inside the allow-list passes,
#                     anything else passes only once the owner approved exactly this commit
#   tests-from-main   the pull request's tree with main's test runner and main's version of every existing test put over
#                     it, run with no token and no secret
name: fixer-gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
concurrency:
  group: fixer-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fixer-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # main's files only. The pull request's code is never checked out in this job.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/pr-gate.mjs
            .github/fixer-gate.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Judge the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-gate.mjs
  tests-from-main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      # main's runner and main's version of every test main has; tests the pull request adds stay
      - name: Put main's tests and checks over the pull request's
        run: |
          cp main/scripts/check-globals.mjs pr/scripts/check-globals.mjs
          for f in main/scripts/*.test.mjs; do cp "$f" "pr/scripts/$(basename "$f")"; done
      # from here on the pull request's code runs: no token, no secret, nothing of this job is trusted afterwards
      - name: Run them
        working-directory: pr
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node scripts/check-globals.mjs
          node --test --test-concurrency=2 scripts/*.test.mjs
