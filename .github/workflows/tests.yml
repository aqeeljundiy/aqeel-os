name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-globals.mjs
        env:
          TZ: Asia/Jakarta
          TMPDIR: ${{ runner.temp }}
      - run: node --test scripts/*.test.mjs
        env:
          TZ: Asia/Jakarta
          TMPDIR: ${{ runner.temp }}
