# The one test check. The job is named "tests": branch protection on main requires that check, so GitHub auto-merge waits for it.
# Green on main today (about 1,400 tests in scripts/, 89 in code/, run on Linux; a handful skip themselves); red means a real regression.
# TZ and TMPDIR match the live install: the tests assume the install's time zone and keep their scratch outside /tmp.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the secret scan below reads the commits of this push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pre-merge check (12 Nov 2026, maintainability audit action 1): no conflict marker in any tracked text file, every JS, shell, JSON, YAML and Python
      # file parses, a regex that lost its backslashes, a file over 1 MB or a scratch file added by accident. It also runs in fixer-gate.yml (main's copy),
      # scripts/hooks/pre-push and scripts/deploy.sh. --base compares with what the push or pull request started from (the diff rule for lost backslashes).
      - name: Pre-merge check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/premerge-check.mjs ${BASE:+--base "$BASE"}
      # Secret scan (12 Nov 2026): gitleaks, the pinned release binary (checksum checked), settings in .gitleaks.toml (known test fixtures allowed by path and value).
      # It reads the whole tree and every commit this push or pull request adds; any new finding fails the job. A real credential is rotated, not allowed.
      - name: Secret scan (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          V=8.30.1
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          GL="$RUNNER_TEMP/gitleaks"
          "$GL" dir . --redact --no-banner
          case "$BASE" in ""|0000000000000000000000000000000000000000) RANGE="-n 50 $HEAD_SHA";; *) RANGE="$BASE..$HEAD_SHA";; esac
          "$GL" git . --redact --no-banner --log-opts="$RANGE"
      # optional: the install's private word list (agent, staff and client names) as an Actions secret, so the word tests of repo-privacy run here too
      - name: Private word list
        env:
          PW: ${{ secrets.PRIVATE_WORDS_JSON }}
        run: if [ -n "$PW" ]; then printf '%s' "$PW" > "$RUNNER_TEMP/pw.json"; echo "AQEELOS_PRIVATE_WORDS=$RUNNER_TEMP/pw.json" >> "$GITHUB_ENV"; fi
      - run: node scripts/check-globals.mjs
      # the runner context only exists inside a step: at job level it made the whole workflow invalid (every run failed with no job)
      # --test-timeout: one test that never ends (a server left open, a timer) fails after 2 minutes instead of hanging the run (audit H11)
      - run: node --test --test-concurrency=2 --test-timeout=120000 scripts/*.test.mjs
        env:
          TMPDIR: ${{ runner.temp }}
      # the flicker check in a real browser (12 Nov 2026): headless Chrome on the runner, this copy of the app on an empty data
      # folder, no engine. Fails when the sidebar or topbar is drawn again while pages change, or a page moves while it loads.
      # The full run (every page, real data) is the nightly one on the box (scripts/box-check.sh, app/browser-checks.mjs).
      - run: node scripts/flicker-ci.mjs
        env:
          TMPDIR: ${{ runner.temp }}
      # code by aqeel (code/): its own tests, never run before 12 Nov 2026. The npm "test" script misses bridge.test.mjs, so the files are listed by name here.
      - name: code/ tests
        working-directory: code
        run: |
          npm ci --no-audit --no-fund
          node --test --test-concurrency=2 --test-timeout=120000 test.mjs *.test.mjs desktop/*.test.mjs
        env:
          TMPDIR: ${{ runner.temp }}
      # Python tests that run on a bare runner. NOT run here, on purpose: scripts/engine-fixes.test.py and scripts/kirim-signature.test.py import the
      # installed engine (~/.hermes/hermes-agent, "No module named hermes_bootstrap" here), and the plugin suite in
      # engine/claude-subscription-directsdk-experimental/tests needs the same engine (11 failed, 63 errors on a Linux box without its modules).
      # They run on a box: scripts/live-test.sh (engine-fixes) and by hand. Moving them here needs a pinned engine checkout (audit action 13).
      - name: Python tests
        run: python3 -I scripts/group-context.test.py
